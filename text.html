<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تشغيل بوت التليجرام</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0d0d0d;
            color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 650px;
            background: rgba(22, 22, 22, 0.85);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(212, 175, 55, 0.15);
            backdrop-filter: blur(10px);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            padding-bottom: 15px;
        }

        .header h1 {
            color: #d4af37;
            font-size: 1.8rem;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 1.1rem;
            margin-top: 10px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #ff4d4d;
            box-shadow: 0 0 8px #ff4d4d;
            transition: all 0.3s ease;
        }

        .status-dot.active {
            background-color: #00ff88;
            box-shadow: 0 0 10px #00ff88;
        }

        .bot-info {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(212, 175, 55, 0.2);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }

        .bot-info p {
            margin-bottom: 8px;
            color: #cccccc;
        }

        .bot-info p span {
            color: #ffd700;
            font-weight: bold;
        }

        .logs-title {
            color: #d4af37;
            font-size: 1rem;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .console {
            background: #050505;
            border: 1px solid #222;
            border-radius: 10px;
            height: 220px;
            overflow-y: auto;
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            color: #a0a0a0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .console::-webkit-scrollbar {
            width: 6px;
        }

        .console::-webkit-scrollbar-thumb {
            background: #d4af37;
            border-radius: 3px;
        }

        .log-item {
            line-height: 1.4;
            word-break: break-word;
        }

        .log-item.success { color: #00ff88; }
        .log-item.info { color: #ffd700; }
        .log-item.error { color: #ff4d4d; }

        .time {
            color: #666;
            margin-left: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>خادم البوت المباشر</h1>
            <div class="status-container">
                <div id="statusDot" class="status-dot"></div>
                <span id="statusText">جاري تشغيل البوت...</span>
            </div>
        </div>

        <div class="bot-info">
            <p>اسم البوت: <span id="botName">جاري الفحص...</span></p>
            <p>معرف البوت: <span id="botUsername">@...</span></p>
            <p>الحالة المفعلة: <span>استجابة تلقائية للأمر /start</span></p>
        </div>

        <div class="logs-title">
            <span>سجل العمليات (Live Logs)</span>
        </div>
        <div class="console" id="console"></div>
    </div>

    <script>
        const BOT_TOKEN = '8945277654:AAFkErfHlC-Qj5m1bWlOAsOq9O9Edv0hjBw';
        const API_URL = `https://api.telegram.org/bot${BOT_TOKEN}`;
        
        let lastUpdateId = 0;
        let isRunning = false;

        function log(message, type = 'normal') {
            const consoleEl = document.getElementById('console');
            const timeStr = new Date().toLocaleTimeString('ar-EG');
            
            const logElement = document.createElement('div');
            logElement.className = `log-item ${type}`;
            logElement.innerHTML = `<span class="time">[${timeStr}]</span> ${message}`;
            
            consoleEl.appendChild(logElement);
            consoleEl.scrollTop = consoleEl.scrollHeight;
        }

        async function initBot() {
            try {
                log("جاري الاتصال بـ Telegram API...", "info");
                const res = await fetch(`${API_URL}/getMe`);
                const data = await res.json();

                if (data.ok) {
                    document.getElementById('botName').innerText = data.result.first_name;
                    document.getElementById('botUsername').innerText = '@' + data.result.username;
                    document.getElementById('statusDot').classList.add('active');
                    document.getElementById('statusText').innerText = 'البوت يعمل بنجاح';
                    log(`تم الاتصال بنجاح بالبوت: @${data.result.username}`, "success");
                    
                    isRunning = true;
                    pollUpdates();
                } else {
                    throw new Error(data.description || "فشل التحقق من التوكن");
                }
            } catch (err) {
                document.getElementById('statusText').innerText = 'خطأ في الاتصال';
                log(`خطأ: ${err.message}`, "error");
            }
        }

        async function pollUpdates() {
            while (isRunning) {
                try {
                    const res = await fetch(`${API_URL}/getUpdates?offset=${lastUpdateId + 1}&timeout=30`);
                    const data = await res.json();

                    if (data.ok && data.result.length > 0) {
                        for (const update of data.result) {
                            lastUpdateId = update.update_id;
                            handleUpdate(update);
                        }
                    }
                } catch (err) {
                    log(`خطأ أثناء جلب الرسائل: ${err.message}`, "error");
                    await new Promise(r => setTimeout(r, 5000));
                }
            }
        }

        async function handleUpdate(update) {
            if (update.message && update.message.text) {
                const chatId = update.message.chat.id;
                const text = update.message.text.trim();
                const userName = update.message.from.first_name || "مستخدم";

                log(`رسالة واردة من [${userName}]: ${text}`, "info");

                if (text === '/start') {
                    await sendMessage(chatId, "مرحبا بك");
                }
            }
        }

        async function sendMessage(chatId, text) {
            try {
                const res = await fetch(`${API_URL}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: text
                    })
                });

                const data = await res.json();
                if (data.ok) {
                    log(`تم الرد بنجاح: "${text}"`, "success");
                } else {
                    log(`فشل إرسال الرد: ${data.description}`, "error");
                }
            } catch (err) {
                log(`خطأ في الإرسال: ${err.message}`, "error");
            }
        }

        window.onload = initBot;
    </script>
</body>
</html>
